name: Build desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: macos-universal
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Build app
        shell: bash
        run: |
          # Signed in-app updates (tauri-plugin-updater) only when the signing key secret exists;
          # without it the build stays exactly as before and the app uses the GitHub API check.
          extra=()
          if [ -n "$SIGN_KEY" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGN_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGN_KEY_PASSWORD"
            extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
            echo "updater signing: on"
          else
            echo "updater signing: off (no TAURI_SIGNING_PRIVATE_KEY secret)"
          fi
          pnpm tauri build ${{ matrix.args }} "${extra[@]}"
        env:
          # Let bundle_dmg.sh run its Finder AppleScript so the DMG gets our background and icon layout
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          SIGN_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGN_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        timeout-minutes: 30

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/smoke-macos.sh

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Iconette-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/msi/*.msi.sig
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.name }}
          path: smoke-*.png
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Iconette-*
          path: dist-release
          merge-multiple: true
      - name: Updater manifest (only when the build was signed)
        run: python3 scripts/updater-manifest.py dist-release "${{ github.ref_name }}" dist-release/latest.json
      - name: List files
        run: find dist-release -type f
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Icônette ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist-release/**/*.dmg
            dist-release/**/*.exe
            dist-release/**/*.msi
            dist-release/**/*.app.tar.gz
            dist-release/**/*.sig
            dist-release/latest.json
