const DOOD=['M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z','M3 12h18M12 3v18','M4 7h16M4 12h16M4 17h10','M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z','M5 12l5 5L20 7','M21 21l-4.3-4.3M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14z','M3 9l9-6 9 6v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z','M12 8v4l3 2M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z'];
function doodles(w,h,n,seed,color,op){let s=seed;const r=()=>(s=(s*16807)%2147483647)/2147483647;let o='';
  for(let i=0;i<n;i++){const x=r()*w,y=r()*h,sc=.7+r()*.9,rot=(r()-.5)*40;o+=`<path d="${DOOD[i%DOOD.length]}" transform="translate(${x} ${y}) rotate(${rot}) scale(${sc}) translate(-12 -12)" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>`}return o}
const A={

  icon:[1024,1024,`<svg width="1024" height="1024" viewBox="0 0 100 100">${ART}</svg>`],
  // macOS icon: 824px body on a 1024 canvas (Apple grid) with a soft shadow
  'icon-macos':[1024,1024,`<svg width="1024" height="1024" viewBox="0 0 1024 1024"><defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter></defs><g filter="url(#s)" transform="translate(100 100) scale(9.3636) translate(-6 -6)">${ART}</g></svg>`],

    <path d="M262 186 C 300 150, 360 150, 398 186" fill="none" stroke="${K}" stroke-opacity=".45" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#ah)"/>

    <text x="330" y="88" text-anchor="middle" ${FONT} font-size="12" fill="#8e8e93">小小的 Icônes · 图标和组件，一搜就有</text>
    <text x="330" y="300" text-anchor="middle" ${FONT} font-size="12.5" fill="${K}" fill-opacity=".75">把图标拖进「应用程序」就装好了</text>
    <rect x="196" y="340" width="268" height="26" rx="13" fill="${K}" fill-opacity=".05"/>
    <text x="330" y="357" text-anchor="middle" ${FONT} font-size="11" fill="#8e8e93">第一次打开：右键 App → 打开</text></svg>`],
  sidebar:[164,314,`<svg width="164" height="314" viewBox="0 0 164 314"><rect width="164" height="314" fill="${K}"/>${doodles(164,314,14,3,'#fff',.07)}
    <g transform="translate(46 96)"><svg width="72" height="72" viewBox="0 0 100 100">${ART.replace(`fill="${K}"`,'fill="#2c2c2f"')}</svg></g>
    <text x="82" y="200" text-anchor="middle" ${FONT} font-size="17" font-weight="700" fill="${I}">Icônette</text>
    <text x="82" y="220" text-anchor="middle" ${FONT} font-size="10" fill="${I}" fill-opacity=".5">图标 · 组件 · 一搜就有</text>
    <rect x="70" y="284" width="24" height="3" rx="1.5" fill="${R}"/></svg>`],
  header:[150,57,`<svg width="150" height="57" viewBox="0 0 150 57"><rect width="150" height="57" fill="#fff"/>${doodles(150,57,5,11,K,.06)}<g transform="translate(100 10)"><svg width="37" height="37" viewBox="0 0 100 100">${ART}</svg></g></svg>`],
  logo:[0,0,`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${ART}</svg>`],
};
const k=new URLSearchParams(location.search).get('a')||'icon';
document.getElementById('o').innerHTML=A[k][2];window.ASSET=A;
</script></body></html>
